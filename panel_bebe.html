<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Panel · Bebé en camino 🍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#E9C46A;--gold-hi:#FFE6A8;--gold-lo:#A97C2A;
  --rose:#F2A6A0;--crim:#E0465A;
  --bg:#09070F;--card:rgba(255,255,255,.04);--border:rgba(233,196,106,.15);
  --ink:#FBF6EE;--dim:rgba(251,246,238,.45);
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink)}

/* ── LOGIN ── */
#login{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(80% 60% at 50% 30%,rgba(233,196,106,.12),transparent 70%),var(--bg);
  padding:24px;
}
#login.oculto{display:none}
.login-box{
  background:rgba(255,255,255,.04);border:1.5px solid var(--border);
  border-radius:20px;padding:40px 32px;max-width:340px;width:100%;
  text-align:center;backdrop-filter:blur(12px);
}
.login-ico{font-size:2.8rem;margin-bottom:12px}
.login-title{font-family:var(--serif);font-weight:300;font-size:2.2rem;letter-spacing:.02em;
  color:var(--gold-hi);margin-bottom:4px}
.login-sub{font-size:.82rem;color:var(--dim);margin-bottom:28px}
.login-input{
  width:100%;padding:14px 16px;border-radius:12px;
  border:1.5px solid var(--border);background:rgba(255,255,255,.06);
  color:#fff;font-family:'Nunito',sans-serif;font-size:1rem;
  outline:none;text-align:center;letter-spacing:.2em;margin-bottom:14px;
  transition:border-color .3s;
}
.login-input:focus{border-color:var(--gold)}
.login-input::placeholder{letter-spacing:.08em;color:rgba(255,255,255,.25)}
.login-btn{
  width:100%;padding:14px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold-lo),var(--gold));color:#2a1a04;
  font-family:var(--sans);font-weight:700;font-size:1rem;
  box-shadow:0 8px 24px rgba(233,196,106,.25);transition:transform .15s;
}
.login-btn:active{transform:scale(.97)}
.login-error{font-size:.8rem;color:#ff6b6b;margin-top:10px;display:none}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}

/* HEADER */
.header{
  background:rgba(9,7,15,.9);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(233,196,106,.1);
  padding:max(env(safe-area-inset-top),14px) 20px 14px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:10;
}
.header-ico{font-size:1.6rem}
.header-info{flex:1}
.header-title{font-family:var(--serif);font-weight:400;font-size:1.5rem;
  color:var(--gold-hi);line-height:1}
.header-sub{font-size:.72rem;color:var(--dim);letter-spacing:.06em;margin-top:2px}
.btn-reload{
  background:rgba(255,255,255,.07);border:1px solid var(--border);
  color:var(--dim);border-radius:10px;padding:8px 14px;cursor:pointer;
  font-size:.8rem;font-family:'Nunito',sans-serif;font-weight:700;
  transition:all .2s;display:flex;align-items:center;gap:6px;
}
.btn-reload:hover{background:rgba(255,255,255,.12);color:#fff}
.btn-reload.girando svg{animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

/* CONTENIDO */
.contenido{flex:1;padding:20px;max-width:700px;margin:0 auto;width:100%}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px 12px;text-align:center;
}
.stat-n{font-family:var(--serif);font-weight:300;font-size:2.4rem;line-height:1}
.stat-l{font-size:.68rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.stat-n.verde{color:#6EE7A8}
.stat-n.rojo{color:var(--rose)}
.stat-n.dorado{color:var(--gold)}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:16px;background:rgba(255,255,255,.04);border-radius:12px;padding:4px}
.tab{flex:1;padding:9px;border:none;border-radius:9px;cursor:pointer;
  font-family:var(--sans);font-weight:600;font-size:.78rem;
  background:none;color:var(--dim);transition:all .2s;letter-spacing:.04em}
.tab.activo{background:rgba(233,196,106,.1);color:var(--gold-hi)}

/* LISTA */
#lista{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:48px 20px;color:var(--dim);font-size:.9rem}
.spinner{text-align:center;padding:48px;font-size:2rem;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* TARJETA MENSAJE */
.tarjeta{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:18px 18px 14px;
  animation:cardIn .35s cubic-bezier(.2,1.3,.4,1);
}
@keyframes cardIn{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.t-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.t-num{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--gold);min-width:24px}
.t-nombre{font-weight:600;font-size:.95rem;flex:1;color:var(--gold-hi)}
.t-badge{font-size:.65rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge-si{background:rgba(110,231,168,.1);color:#6EE7A8;border:1px solid rgba(110,231,168,.25)}
.badge-no{background:rgba(242,166,160,.1);color:var(--rose);border:1px solid rgba(242,166,160,.2)}
.t-sep{height:1px;background:var(--border);margin-bottom:10px}
.t-msg{font-size:.9rem;color:rgba(255,255,255,.8);line-height:1.55;font-style:italic}
.t-msg.vacio{color:var(--dim);font-style:normal;font-size:.82rem}
.t-ts{font-size:.65rem;color:var(--dim);margin-top:8px;text-align:right;letter-spacing:.06em}

/* BTN EXPORT */
.export-wrap{margin-top:24px;padding-bottom:40px}
.btn-export{
  width:100%;padding:16px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold-lo),var(--gold));color:#2a1a04;
  font-family:var(--sans);font-weight:700;font-size:.9rem;letter-spacing:.18em;text-transform:uppercase;
  box-shadow:0 8px 24px rgba(233,196,106,.22);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,box-shadow .15s;
}
.btn-export:active{transform:scale(.97)}
.btn-export:hover{box-shadow:0 12px 32px rgba(233,196,106,.38)}

/* TOAST */
#toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(10,14,26,.95);border:1px solid var(--border);color:#fff;
  border-radius:12px;padding:.75rem 1.3rem;font-size:.85rem;z-index:200;
  opacity:0;transition:all .35s;pointer-events:none;white-space:nowrap;
  box-shadow:0 14px 40px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="login-ico">🍼</div>
    <div class="login-title">Bebé en camino</div>
    <div class="login-sub">Ingresá la contraseña para ver los mensajes</div>
    <input class="login-input" id="pwd-input" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="login-btn" onclick="checkPwd()">Entrar</button>
    <div class="login-error" id="login-error">Contraseña incorrecta</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-ico">🍼</div>
    <div class="header-info">
      <div class="header-title">Betiana & Ángel · Bebé en camino</div>
      <div class="header-sub">Mayo 2027 · Panel de mensajes</div>
    </div>
    <button class="btn-reload" id="btn-reload" onclick="cargar()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
      Actualizar
    </button>
  </div>

  <div class="contenido">
    <!-- STATS -->
    <div class="stats">
      <div class="stat"><div class="stat-n dorado" id="st-total">–</div><div class="stat-l">Lo vieron</div></div>
      <div class="stat"><div class="stat-n rojo" id="st-msg">–</div><div class="stat-l">Con mensaje</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab activo" id="tab-todos" onclick="setTab('todos')">Todos</button>
      <button class="tab" id="tab-msg" onclick="setTab('msg')">💛 Con mensaje</button>
    </div>

    <!-- LISTA -->
    <div id="lista"><div class="spinner">🕷️</div></div>

    <!-- EXPORT -->
    <div class="export-wrap">
      <button class="btn-export" onclick="exportar()">
        ✨ Descargar recuerdo
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://oyhbnzisrdowlwyghjrp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95aGJuemlzcmRvd2x3eWdoanJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTU2ODgsImV4cCI6MjA5NTgzMTY4OH0.wKoyPCRuVbhzxbVsLUcw1h_uv2oGcxfuiJSHDOvgzaw';
const EVENTO     = 'bebe-2027';
const PASSWORD   = 'bebe2027';     // ← cambiá esto si querés

// ── ESTADO ──
let todos = [], tabActual = 'todos';

// ── LOGIN ──
document.getElementById('pwd-input').addEventListener('keydown', e => { if(e.key === 'Enter') checkPwd(); });
function checkPwd(){
  const val = document.getElementById('pwd-input').value;
  if(val === PASSWORD){
    document.getElementById('login').classList.add('oculto');
    document.getElementById('app').classList.add('show');
    cargar();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

// ── FETCH ──
async function cargar(){
  const btn = document.getElementById('btn-reload');
  btn.classList.add('girando');
  document.getElementById('lista').innerHTML = '<div class="spinner">🍼</div>';
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/mensajes_bether?evento=eq.${EVENTO}&order=ts.asc`,
      { headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    todos = await res.json();
    renderStats();
    renderLista();
  } catch(e){
    document.getElementById('lista').innerHTML = '<div class="empty">❌ Error al cargar. Revisá la conexión.</div>';
  }
  btn.classList.remove('girando');
}

// ── STATS ──
function renderStats(){
  const conMsg = todos.filter(m => m.mensaje && m.mensaje.trim()).length;
  document.getElementById('st-total').textContent = todos.length;
  document.getElementById('st-msg').textContent   = conMsg;
}

// ── TABS ──
function setTab(t){
  tabActual = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('activo'));
  document.getElementById('tab-' + t).classList.add('activo');
  renderLista();
}

// ── LISTA ──
function renderLista(){
  let data = todos;
  if(tabActual === 'msg') data = todos.filter(m => m.mensaje && m.mensaje.trim());

  const el = document.getElementById('lista');
  if(!data.length){
    el.innerHTML = '<div class="empty">No hay mensajes todavía 🍼</div>';
    return;
  }
  el.innerHTML = data.map((m, i) => {
    const ts = new Date(m.ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const tieneMsg = m.mensaje && m.mensaje.trim();
    return `
    <div class="tarjeta">
      <div class="t-head">
        <span class="t-num">${String(i+1).padStart(2,'0')}</span>
        <span class="t-nombre">${esc(m.nombre||'—')}</span>
      </div>
      <div class="t-sep"></div>
      ${tieneMsg
        ? `<p class="t-msg">"${esc(m.mensaje)}"</p>`
        : `<p class="t-msg vacio">No dejó mensaje</p>`}
      <div class="t-ts">${ts}</div>
    </div>`;
  }).join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── EXPORT PNG ──
async function exportar(){
  const conMsg = todos.filter(m => m.mensaje && m.mensaje.trim());
  if(!conMsg.length){ toast('No hay mensajes para exportar todavía'); return; }

  toast('Generando imagen…');

  // Construir HTML off-screen
  const wrapper = document.createElement('div');
  wrapper.style.cssText = `position:fixed;left:-9999px;top:0;width:720px;background:#0A0E1A;padding:40px;font-family:Nunito,sans-serif;`;

  // Portada
  wrapper.innerHTML = `
    <div style="background:linear-gradient(160deg,#1B1424,#09070F);border-radius:16px;padding:48px 40px;text-align:center;margin-bottom:12px;border:1px solid rgba(233,196,106,.2)">
      <div style="font-size:.65rem;letter-spacing:.38em;text-transform:uppercase;color:rgba(233,196,106,.5);margin-bottom:14px">palabras con amor para</div>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;font-size:4.5rem;color:#FFE6A8;line-height:.9;letter-spacing:.02em">Betiana & Ángel</div>
      <div style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.3rem;color:rgba(251,246,238,.5);margin:10px 0 20px">van a ser papás 🍼</div>
      <div style="width:44px;height:1px;background:linear-gradient(90deg,transparent,#E9C46A,transparent);margin:0 auto 16px"></div>
      <div style="font-size:.88rem;color:rgba(251,246,238,.35)">Mayo de 2027</div>
      <div style="font-size:.65rem;letter-spacing:.12em;color:rgba(251,246,238,.18);margin-top:14px">${conMsg.length} mensaje${conMsg.length!==1?'s':''}</div>
    </div>`;

  // Mensajes
  conMsg.forEach((m, i) => {
    const div = document.createElement('div');
    div.style.cssText = `background:#FBF4EA;border-radius:4px;padding:44px 48px 40px 60px;margin-bottom:6px;position:relative;`;
    div.innerHTML = `
      <div style="position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#E9C46A,#A97C2A);border-radius:4px 0 0 4px"></div>
      <div style="position:absolute;top:0;bottom:0;left:52px;width:1px;background:rgba(233,196,106,.2)"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.1rem;color:#A97C2A;min-width:24px">${String(i+1).padStart(2,'0')}</span>
        <span style="font-family:Manrope,system-ui,sans-serif;font-weight:600;font-size:.9rem;color:#2C2C3E">${esc(m.nombre||'—')}</span>      </div>
      <div style="width:100%;height:1px;background:linear-gradient(90deg,rgba(233,196,106,.25),transparent);margin-bottom:9px"></div>
      <p style="font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;line-height:1.72;color:#2C2C3E;font-style:italic;padding-left:4px">"${esc(m.mensaje)}"</p>
    `;
    wrapper.appendChild(div);
  });

  // Contra
  const contra = document.createElement('div');
  contra.style.cssText = `background:linear-gradient(160deg,#1B1424,#09070F);border-radius:16px;padding:48px 40px;text-align:center;margin-top:6px;border:1px solid rgba(233,196,106,.12)`;
  contra.innerHTML = `
    <p style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.1rem;color:rgba(251,246,238,.5);line-height:1.7;max-width:380px;margin:0 auto 20px">
      "Guardamos estas palabras para que nuestro bebé las lea algún día y sepa que, antes de nacer, ya estaba <b style="color:#E9C46A;font-style:normal">rodeado de amor</b>."
    </p>
    <div style="width:40px;height:1px;background:linear-gradient(90deg,transparent,#E9C46A,transparent);opacity:.5;margin:0 auto 16px"></div>
    <div style="font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(251,246,238,.18)">Bether Studio · Invitaciones Digitales · 2027</div>`;
  wrapper.appendChild(contra);
  document.body.appendChild(wrapper);

  await new Promise(r => setTimeout(r, 300));

  try{
    const canvas = await html2canvas(wrapper, { scale:2.2, useCORS:true, backgroundColor:'#0A0E1A', logging:false });
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'mensajes-bebe-2027.png'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('¡Imagen descargada! 💛');
    }, 'image/png');
  } catch(e){ toast('Error al generar la imagen'); }

  document.body.removeChild(wrapper);
}

// ── TOAST ──
let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

// ── REALTIME poll cada 30s ──
setInterval(() => { if(document.getElementById('app').classList.contains('show')) cargar(); }, 30000);
</script>
</body>
</html>
